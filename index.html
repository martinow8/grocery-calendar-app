<!DOCTYPE html>
<html lang="en" data-theme="grey">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeSync Hub</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Theme Definitions */
    :root[data-theme="grey"], :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    :root[data-theme="pink"] {
      --bg-main: #180811;
      --bg-card: #2d0d22;
      --border-color: #4a1538;
      --primary-color: #ec4899;
      --primary-hover: #db2777;
      --text-color: #fdf2f8;
      --text-muted: #f472b6;
    }

    /* Core Styles */
    body {
      background-color: var(--bg-main) !important;
      color: var(--text-color) !important;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .card-theme {
      background-color: var(--bg-card);
      border-color: var(--border-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .btn-primary {
      background-color: var(--primary-color) !important;
      color: #ffffff !important;
      transition: background-color 0.2s ease;
    }
    
    .btn-primary:hover {
      background-color: var(--primary-hover) !important;
    }

    .text-muted {
      color: var(--text-muted) !important;
    }

    input {
      color: var(--text-color);
      background-color: var(--bg-card);
    }

    input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .cal-day:hover:not(.empty) {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .cal-day.selected {
      background-color: var(--primary-color) !important;
      color: white !important;
      font-weight: 700;
    }
    .cal-day.has-event {
      position: relative;
    }
    .cal-day.has-event::after {
      content: '';
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--primary-color);
    }
    .cal-day.selected.has-event::after {
      background-color: #ffffff;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="card-theme border-b p-4 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-xl font-bold tracking-wide">LifeSync Hub</h1>
    <div class="flex items-center gap-3">
      <!-- Theme Switcher Button -->
      <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-lg card-theme border hover:opacity-80 flex items-center gap-2 text-xs font-semibold">
        <span id="themeIcon">⚙️</span>
        <span id="themeLabel">Grey Theme</span>
      </button>
      <button id="logoutBtn" onclick="handleLogout()" class="hidden text-xs bg-red-600/20 text-red-400 hover:bg-red-600/30 px-3 py-2 rounded-lg font-semibold border border-red-500/30">
        Sign Out
      </button>
    </div>
  </header>

  <!-- Auth Screen -->
  <main id="authScreen" class="flex-1 flex items-center justify-center p-4">
    <div class="card-theme border rounded-2xl p-6 w-full max-w-sm shadow-xl">
      <h2 id="authTitle" class="text-2xl font-bold mb-2 text-center">Welcome Back</h2>
      <p class="text-xs text-muted mb-6 text-center">Sign in to access your synced grocery list, tasks, and calendar.</p>
      
      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1 text-muted">Email Address</label>
          <input type="email" id="authEmail" required class="w-full p-3 rounded-lg card-theme border focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="user@example.com">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1 text-muted">Password</label>
          <input type="password" id="authPassword" required minlength="6" class="w-full p-3 rounded-lg card-theme border focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="••••••••">
        </div>
        <p id="authError" class="text-xs text-red-400 hidden"></p>
        <button type="submit" id="authSubmitBtn" class="w-full py-3 rounded-lg btn-primary font-bold text-sm shadow-lg">Sign In</button>
      </form>

      <div class="mt-4 text-center">
        <button onclick="toggleAuthMode()" id="authToggleModeBtn" class="text-xs text-muted hover:underline">Don't have an account? Sign Up</button>
      </div>
    </div>
  </main>

  <!-- Main App Screen -->
  <main id="appScreen" class="flex-1 max-w-2xl w-full mx-auto p-4 space-y-6 hidden pb-24">
    
    <!-- Navigation Tabs -->
    <div class="grid grid-cols-3 gap-2 card-theme p-1.5 rounded-xl border">
      <button onclick="switchTab('groceries')" id="tab-groceries" class="py-2.5 text-xs font-bold rounded-lg transition-all btn-primary">🛒 Groceries</button>
      <button onclick="switchTab('tasks')" id="tab-tasks" class="py-2.5 text-xs font-bold rounded-lg transition-all text-muted hover:bg-white/5">📋 Tasks</button>
      <button onclick="switchTab('events')" id="tab-events" class="py-2.5 text-xs font-bold rounded-lg transition-all text-muted hover:bg-white/5">📅 Calendar</button>
    </div>

    <!-- Groceries Section -->
    <section id="section-groceries" class="space-y-4">
      <form onsubmit="addGroceryItem(event)" class="flex gap-2">
        <input type="text" id="groceryInput" placeholder="Add grocery item..." required class="flex-1 p-3 rounded-xl card-theme border focus:outline-none focus:ring-2 text-sm">
        <button type="submit" class="px-5 rounded-xl btn-primary font-bold text-sm">Add</button>
      </form>
      <div id="groceryList" class="space-y-2"></div>
    </section>

    <!-- Tasks Section -->
    <section id="section-tasks" class="space-y-4 hidden">
      <form onsubmit="addTaskItem(event)" class="flex gap-2">
        <input type="text" id="taskInput" placeholder="Add new task..." required class="flex-1 p-3 rounded-xl card-theme border focus:outline-none focus:ring-2 text-sm">
        <button type="submit" class="px-5 rounded-xl btn-primary font-bold text-sm">Add</button>
      </form>
      <div id="taskList" class="space-y-2"></div>
    </section>

    <!-- Calendar Section -->
    <section id="section-events" class="space-y-4 hidden">
      <!-- Interactive Calendar Component -->
      <div class="card-theme p-4 rounded-xl border space-y-3">
        <!-- Month Header -->
        <div class="flex items-center justify-between">
          <button onclick="changeMonth(-1)" class="p-2 text-sm font-bold rounded-lg card-theme border hover:opacity-80">←</button>
          <h3 id="calendarMonthYear" class="text-sm font-bold tracking-wide"></h3>
          <button onclick="changeMonth(1)" class="p-2 text-sm font-bold rounded-lg card-theme border hover:opacity-80">→</button>
        </div>

        <!-- Weekday Headers -->
        <div class="grid grid-cols-7 text-center text-xs font-semibold text-muted">
          <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
        </div>

        <!-- Calendar Days Grid -->
        <div id="calendarDays" class="grid grid-cols-7 gap-1"></div>
      </div>

      <!-- Add Event Form for Selected Date -->
      <form onsubmit="addEventItem(event)" class="space-y-2 card-theme p-4 rounded-xl border">
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-bold text-muted">Add Event for Selected Day</label>
          <span id="selectedDateDisplay" class="text-xs font-semibold text-muted"></span>
        </div>
        <input type="text" id="eventTitle" placeholder="Event Title" required class="w-full p-2.5 rounded-lg card-theme border text-sm">
        <input type="time" id="eventTime" required class="w-full p-2.5 rounded-lg card-theme border text-sm">
        <button type="submit" class="w-full py-2.5 rounded-lg btn-primary font-bold text-sm">Add Event</button>
      </form>

      <!-- Events List for Selected Date -->
      <div class="space-y-2">
        <h4 class="text-xs font-bold text-muted px-1">Events on Selected Date</h4>
        <div id="eventList" class="space-y-2"></div>
      </div>
    </section>

  </main>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker Registered:', reg.scope))
          .catch((err) => console.log('Service Worker Registration Failed:', err));
      });
    }
  </script>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTOMSxOalIm2T4osNh5qdBH9tNBYGZYzY",
      authDomain: "grocery-calendar-app.firebaseapp.com",
      projectId: "grocery-calendar-app",
      storageBucket: "grocery-calendar-app.firebasestorage.app",
      messagingSenderId: "878403563311",
      appId: "1:878403563311:web:7f11d993506c81cb7b7bda"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    setPersistence(auth, browserLocalPersistence);

    let isSignUp = false;
    let loadedEvents = [];

    // Calendar State Variables
    let currentDate = new Date();
    let selectedDateStr = new Date().toISOString().split('T')[0];

    // Theme Switcher Logic
    window.toggleTheme = function() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'grey';
      const newTheme = currentTheme === 'grey' ? 'pink' : 'grey';
      setTheme(newTheme);
    };

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('lifesync_theme', theme);
      
      const label = document.getElementById('themeLabel');
      const icon = document.getElementById('themeIcon');
      if (theme === 'pink') {
        label.innerText = 'Pink Theme';
        icon.innerText = '🌸';
      } else {
        label.innerText = 'Grey Theme';
        icon.innerText = '⚙️';
      }
    }

    const savedTheme = localStorage.getItem('lifesync_theme') || 'grey';
    setTheme(savedTheme);

    // Auth Switcher
    window.toggleAuthMode = function() {
      isSignUp = !isSignUp;
      document.getElementById('authTitle').innerText = isSignUp ? "Create Account" : "Welcome Back";
      document.getElementById('authSubmitBtn').innerText = isSignUp ? "Sign Up" : "Sign In";
      document.getElementById('authToggleModeBtn').innerText = isSignUp ? "Already have an account? Sign In" : "Don't have an account? Sign Up";
    };

    window.handleAuth = async function(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const errorEl = document.getElementById('authError');
      errorEl.classList.add('hidden');

      try {
        if (isSignUp) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        errorEl.innerText = err.message;
        errorEl.classList.remove('hidden');
      }
    };

    window.handleLogout = function() {
      signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('appScreen').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        listenToCollections();
        renderCalendar();
      } else {
        document.getElementById('authScreen').classList.remove('hidden');
        document.getElementById('appScreen').classList.add('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
      }
    });

    // Navigation Tabs
    window.switchTab = function(tab) {
      ['groceries', 'tasks', 'events'].forEach(t => {
        const sec = document.getElementById(`section-${t}`);
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          sec.classList.remove('hidden');
          btn.className = "py-2.5 text-xs font-bold rounded-lg transition-all btn-primary";
        } else {
          sec.classList.add('hidden');
          btn.className = "py-2.5 text-xs font-bold rounded-lg transition-all text-muted hover:bg-white/5";
        }
      });
    };

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Interactive Calendar Logic
    window.changeMonth = function(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      renderCalendar();
    };

    window.selectDate = function(dateStr) {
      selectedDateStr = dateStr;
      renderCalendar();
      renderEvents();
    };

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Month Name Header
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('calendarMonthYear').innerText = `${monthNames[month]} ${year}`;
      
      const selectedDisplay = new Date(selectedDateStr + 'T00:00:00');
      document.getElementById('selectedDateDisplay').innerText = selectedDisplay.toLocaleDateString(undefined, { dateStyle: 'medium' });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const daysContainer = document.getElementById('calendarDays');
      daysContainer.innerHTML = '';

      // Empty padding cells for start of month
      for (let i = 0; i < firstDay; i++) {
        daysContainer.innerHTML += `<div class="cal-day empty"></div>`;
      }

      // Populate month days
      for (let day = 1; day <= daysInMonth; day++) {
        const monthPad = String(month + 1).padStart(2, '0');
        const dayPad = String(day).padStart(2, '0');
        const dateStr = `${year}-${monthPad}-${dayPad}`;

        const isSelected = dateStr === selectedDateStr ? 'selected' : '';
        const hasEvent = loadedEvents.some(e => e.date && e.date.startsWith(dateStr)) ? 'has-event' : '';

        daysContainer.innerHTML += `
          <div onclick="selectDate('${dateStr}')" class="cal-day ${isSelected} ${hasEvent}">
            ${day}
          </div>`;
      }
    }

    function renderEvents() {
      const list = document.getElementById('eventList');
      list.innerHTML = '';

      const filteredEvents = loadedEvents.filter(e => e.date && e.date.startsWith(selectedDateStr));

      if (filteredEvents.length === 0) {
        list.innerHTML = `<p class="text-xs text-muted italic p-2">No events scheduled for this day.</p>`;
        return;
      }

      filteredEvents.forEach((item) => {
        const cleanTitle = escapeHtml(item.title);
        const timeStr = item.date.includes('T') ? item.date.split('T')[1] : '';
        list.innerHTML += `
          <div class="flex items-center justify-between p-3 rounded-xl card-theme border">
            <div>
              <p class="text-sm font-semibold">${cleanTitle}</p>
              ${timeStr ? `<p class="text-xs text-muted">🕒 ${timeStr}</p>` : ''}
            </div>
            <button onclick="deleteDocItem('events', '${item.id}')" class="text-xs text-red-400 px-2 py-1">✕</button>
          </div>`;
      });
    }

    // Shared Collection Listeners
    function listenToCollections() {
      onSnapshot(collection(db, "groceries"), (snapshot) => {
        const list = document.getElementById('groceryList');
        list.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const cleanName = escapeHtml(item.name);
          list.innerHTML += `
            <div class="flex items-center justify-between p-3 rounded-xl card-theme border">
              <span class="text-sm ${item.completed ? 'line-through opacity-50' : ''}">${cleanName}</span>
              <div class="flex gap-2">
                <button onclick="toggleGrocery('${docSnap.id}', ${!item.completed})" class="text-xs px-2 py-1 rounded card-theme border">${item.completed ? 'Undo' : 'Done'}</button>
                <button onclick="deleteDocItem('groceries', '${docSnap.id}')" class="text-xs text-red-400 px-2 py-1">✕</button>
              </div>
            </div>`;
        });
      });

      onSnapshot(collection(db, "tasks"), (snapshot) => {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const cleanTitle = escapeHtml(item.title);
          list.innerHTML += `
            <div class="flex items-center justify-between p-3 rounded-xl card-theme border">
              <span class="text-sm ${item.completed ? 'line-through opacity-50' : ''}">${cleanTitle}</span>
              <div class="flex gap-2">
                <button onclick="toggleTask('${docSnap.id}', ${!item.completed})" class="text-xs px-2 py-1 rounded card-theme border">${item.completed ? 'Undo' : 'Done'}</button>
                <button onclick="deleteDocItem('tasks', '${docSnap.id}')" class="text-xs text-red-400 px-2 py-1">✕</button>
              </div>
            </div>`;
        });
      });

      onSnapshot(collection(db, "events"), (snapshot) => {
        loadedEvents = [];
        snapshot.forEach((docSnap) => {
          loadedEvents.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderCalendar();
        renderEvents();
      });
    }

    // Database Actions
    window.addGroceryItem = async (e) => {
      e.preventDefault();
      const input = document.getElementById('groceryInput');
      await addDoc(collection(db, "groceries"), { name: input.value, completed: false, createdAt: Date.now() });
      input.value = '';
    };

    window.addTaskItem = async (e) => {
      e.preventDefault();
      const input = document.getElementById('taskInput');
      await addDoc(collection(db, "tasks"), { title: input.value, completed: false, createdAt: Date.now() });
      input.value = '';
    };

    window.addEventItem = async (e) => {
      e.preventDefault();
      const title = document.getElementById('eventTitle');
      const time = document.getElementById('eventTime');
      const dateTimeStr = `${selectedDateStr}T${time.value}`;
      
      await addDoc(collection(db, "events"), { title: title.value, date: dateTimeStr, createdAt: Date.now() });
      title.value = '';
      time.value = '';
    };

    window.toggleGrocery = async (id, completed) => {
      await updateDoc(doc(db, "groceries", id), { completed });
    };

    window.toggleTask = async (id, completed) => {
      await updateDoc(doc(db, "tasks", id), { completed });
    };

    window.deleteDocItem = async (col, id) => {
      await deleteDoc(doc(db, col, id));
    };
  </script>
</body>
</html>
